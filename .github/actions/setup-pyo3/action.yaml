---
# Checkout the pyo3 CL-model source tree and prepare its Python environment.
#
# The source is the PRIVATE repo rain91508-cmd/gem5. The pyo3 runners/scripts
# live inside that tree and resolve pymtl3_submodule/ next to src/, so the gem5
# tree must sit at the workspace ROOT. This action shallow-clones gem5 at the
# chosen ref (via the KEY_PULL_REPO PAT over https) into the workspace root,
# shallow-fetches the two submodules the CI uses (riscv-tests + the private
# pymtl3_submodule, whose ssh-pinned URL is rewritten to PAT-https for the
# fetch), then installs python 3.12 + pymtl3 + the test deps.
#
# riscv-isa-sim is only fetched+built when build_spike=true (the co-sim job,
# ADR 0013). In that case it is cloned from the PUBLIC fork
# rain91508-cmd/riscv-isa-sim at the pinned cosim branch -- CI never goes
# through the gem5 gitlink for it, which keeps this flow independent of the
# submodule-URL decision.
#
# Outputs:
#   gem5_sha   full SHA of the checked-out gem5 commit
#   gem5_ref   the ref that was checked out
name: Setup pyo3 (checkout gem5 + python env)

inputs:
    gem5_ref:
        description: Branch/tag/SHA in rain91508-cmd/gem5 to test
        required: false
        default: pycpu
    key_pull_repo:
        description: PAT with read access to rain91508-cmd/gem5
        required: true
    build_spike:
        description: >-
            true = also clone the Spike cosim fork, build libriscv and the
            pyspike_cosim binding (co-sim job only; adds ~10-15 min)
        required: false
        default: 'false'
    spike_repo:
        description: Spike fork (public) used by the cosim
        required: false
        default: rain91508-cmd/riscv-isa-sim
    spike_ref:
        description: Branch/SHA in the Spike fork (cosim branch, ADR 0013 D5)
        required: false
        default: cosim-pycpu

outputs:
    gem5_sha:
        description: Full SHA of the checked-out gem5 commit
        value: ${{ steps.checkout.outputs.gem5_sha }}
    gem5_ref:
        description: The gem5 ref that was checked out
        value: ${{ inputs.gem5_ref }}

runs:
    using: composite
    steps:
        - name: Checkout gem5 @ ${{ inputs.gem5_ref }} (private, via PAT)
          id: checkout
          shell: bash
          env:
              GEM5_REF: ${{ inputs.gem5_ref }}
              KEY_PULL_REPO: ${{ inputs.key_pull_repo }}
          run: |
              set -euo pipefail
              echo "Cloning rain91508-cmd/gem5 @ ${GEM5_REF}"
              git clone --depth 1 --branch "${GEM5_REF}" \
                  "https://x-access-token:${KEY_PULL_REPO}@github.com/rain91508-cmd/gem5.git" .
              SHA=$(git rev-parse HEAD)
              echo "gem5_sha=${SHA}" >> "$GITHUB_OUTPUT"
              echo "gem5 @ ${GEM5_REF}: $(git rev-parse --short HEAD)"
              # pymtl3_submodule is ssh-pinned; rewrite ssh->PAT-https for this
              # fetch only. riscv-tests is public (nested `env` is fetched by
              # --recursive). riscv-isa-sim stays unfetched unless build_spike.
              git -c "url.https://x-access-token:${KEY_PULL_REPO}@github.com/.insteadOf=git@github.com:" \
                  submodule update --init --recursive --depth 1 -- \
                      src/cpu/pyo3/riscv-tests pymtl3_submodule
              test -f pymtl3_submodule/pymtl3/__init__.py || {
                  echo "::error::pymtl3_submodule missing after checkout"; exit 1; }
              test -f src/cpu/pyo3/riscv-tests/env/p/riscv_test.h || {
                  echo "::error::riscv-tests env missing after checkout"; exit 1; }
              echo "pymtl3 @ $(git -C pymtl3_submodule rev-parse --short HEAD)"

        # ------------------------------------------------------------------
        # Co-sim only (ADR 0013): the forked Spike + the pyspike_cosim binding.
        # Deps (dtc, boost) come from apt; libriscv.so is what the binding
        # links (spike's default build is shared+static). The binding build is
        # deliberately outside spike's autotools (D21: a normal make never
        # touches it). ~10-15 min on a 4-core runner.
        # ------------------------------------------------------------------
        - name: Build Spike cosim fork + pyspike_cosim binding
          if: ${{ inputs.build_spike == 'true' }}
          shell: bash
          env:
              SPIKE_REPO: ${{ inputs.spike_repo }}
              SPIKE_REF: ${{ inputs.spike_ref }}
          run: |
              set -euo pipefail
              sudo apt-get update -q
              sudo apt-get install -y --no-install-recommends \
                  dtc libboost-dev libboost-regex-dev python3-dev
              cd src/cpu/pyo3
              # The submodule path exists but is empty (not fetched); clone
              # the public fork's cosim branch into it.
              rmdir riscv-isa-sim 2>/dev/null || true
              git clone --depth 1 --branch "${SPIKE_REF}" \
                  "https://github.com/${SPIKE_REPO}.git" riscv-isa-sim
              echo "spike @ $(git -C riscv-isa-sim rev-parse --short HEAD)"
              mkdir -p spike-build && cd spike-build
              ../riscv-isa-sim/configure \
                  --prefix="$PWD/../spike-install" >/dev/null
              make -j"$(nproc)"
              cd ../riscv-isa-sim/pycosim
              BOOST_INC=/usr/include ./build.sh
              python3 -c 'import sys; sys.path.insert(0, "."); \
                  import pyspike_cosim; print("pyspike_cosim import OK")'

        # Inline of gem5's .github/actions/pyo3-env (submodules already present):
        # python 3.12 + pymtl3 (pip-installed from pymtl3_submodule) + test deps.
        - uses: actions/setup-python@v5
          with:
              python-version: '3.12'

        - name: Install pymtl3 and the test dependencies
          shell: bash
          run: |
              python -m pip install --upgrade pip
              pip install ./pymtl3_submodule pytest ply pyelftools
              python -c 'import pymtl3, pytest, ply, elftools; \
                         print("pyo3 python deps OK:", pymtl3.__file__)'
